plugins {
    id 'com.android.application'
}

android {
    namespace 'com.oliveira.olink'
    compileSdk 35

    defaultConfig {
        applicationId 'com.oliveira.olink'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    def olinkStorePath = System.getenv("OLINK_KEYSTORE_PATH")
    if (olinkStorePath != null && !olinkStorePath.isEmpty()) {
        signingConfigs {
            olinkFixed {
                storeFile file(olinkStorePath)
                storePassword System.getenv("OLINK_STORE_PASSWORD")
                keyAlias System.getenv("OLINK_KEY_ALIAS")
                keyPassword System.getenv("OLINK_KEY_PASSWORD")
            }
        }
        buildTypes {
            debug {
                signingConfig signingConfigs.olinkFixed
            }
        }
    }
}


dependencies {
    implementation 'com.github.teamnewpipe:newpipeextractor:v0.26.5'
}
