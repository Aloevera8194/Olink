name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

        with:
          packages: platform-tools
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Configure fixed Olink signing key
        env:
          OLINK_KEYSTORE_BASE64: ${{ secrets.OLINK_KEYSTORE_BASE64 }}
          OLINK_STORE_PASSWORD: ${{ secrets.OLINK_STORE_PASSWORD }}
          OLINK_KEY_PASSWORD: ${{ secrets.OLINK_KEY_PASSWORD }}
          OLINK_KEY_ALIAS: ${{ secrets.OLINK_KEY_ALIAS }}
        run: |
          echo "$OLINK_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/olink-signing.jks"
          echo "OLINK_KEYSTORE_PATH=$RUNNER_TEMP/olink-signing.jks" >> "$GITHUB_ENV"
          echo "OLINK_STORE_PASSWORD=$OLINK_STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "OLINK_KEY_PASSWORD=$OLINK_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "OLINK_KEY_ALIAS=$OLINK_KEY_ALIAS" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Olink-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
